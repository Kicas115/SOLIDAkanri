<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蔵書管理 かんばん</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>蔵書管理 かんばん</h1>
      <div class="header-actions">
        <button id="sns-btn" class="btn-sns">SNS販促</button>
      </div>
    </header>

    <section class="kanban-section">
      <div class="kanban-board">
        <div class="kanban-list">
          <h2>積読</h2>
          <div class="kanban-cards" data-status="積読"></div>
        </div>
        <div class="kanban-list">
          <h2>読了</h2>
          <div class="kanban-cards" data-status="読了"></div>
        </div>
        <div class="kanban-list">
          <h2>搬入する</h2>
          <div class="kanban-cards" data-status="搬入する"></div>
        </div>
        <div class="kanban-list">
          <h2>搬入済み</h2>
          <div class="kanban-cards" data-status="搬入済み"></div>
        </div>
        <div class="kanban-list">
          <h2>売れた</h2>
          <div class="kanban-cards" data-status="売れた"></div>
        </div>
      </div>
    </section>

    <!-- 新規追加モーダル -->
    <div id="add-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>本を追加</h2>
          <button class="modal-close">&times;</button>
        </div>
        <form id="add-form">
          <label>タイトル<br><input id="add-title" required></label>
          <label>仕入れ値（¥）<br><input id="add-cost" type="number" min="0" step="0.01"></label>
          <label>売値（¥）<br><input id="add-price" type="number" min="0" step="0.01"></label>
          <div class="modal-actions">
            <button type="submit">追加</button>
            <button type="button" class="modal-cancel">キャンセル</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 編集モーダル -->
    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>本を編集</h2>
          <button class="modal-close">&times;</button>
        </div>
        <form id="edit-form">
          <label>タイトル<br><input id="edit-title" required></label>
          <label>仕入れ値（¥）<br><input id="edit-cost" type="number" min="0" step="0.01"></label>
          <label>売値（¥）<br><input id="edit-price" type="number" min="0" step="0.01"></label>
          <div class="modal-actions">
            <button type="submit">保存</button>
            <button type="button" class="modal-delete">削除</button>
            <button type="button" class="modal-cancel">キャンセル</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="sns-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>SNS販促文</h2>
        <button class="modal-close" id="sns-modal-close">&times;</button>
      </div>
      <div id="sns-modal-body" style="padding:16px;min-height:60px">
        <div class="sns-settings">
          <label for="sns-api-key-input">Gemini APIキー</label>
          <div class="api-key-row">
            <input id="sns-api-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="Gemini APIキーを入力">
            <button id="sns-api-key-save" type="button" class="secondary-btn">保存</button>
          </div>
          <label for="sns-model-input" style="display:block;margin-top:12px">Gemini モデル名</label>
          <div class="api-key-row">
            <input id="sns-model-input" type="text" autocomplete="off" spellcheck="false" placeholder="gemini-3.5-flash-lite" value="gemini-3.5-flash-lite">
          </div>
          <div class="api-key-meta">
            <span id="sns-api-key-status">未設定</span>
            <button id="sns-api-key-clear" type="button" class="link-btn">削除</button>
          </div>
        </div>
        <div class="sns-options">
          <div class="sns-option-group">
            <label style="display:block;margin-bottom:8px;font-weight:bold">プラットフォーム</label>
            <div style="display:flex;gap:12px">
              <label style="display:flex;align-items:center;gap:6px">
                <input type="radio" name="sns-platform" value="x" checked> X（Twitter）
              </label>
              <label style="display:flex;align-items:center;gap:6px">
                <input type="radio" name="sns-platform" value="instagram"> Instagram
              </label>
            </div>
          </div>
          <div class="sns-option-group" style="margin-top:12px">
            <label style="display:block;margin-bottom:8px;font-weight:bold">トーン</label>
            <div style="display:flex;gap:12px">
              <label style="display:flex;align-items:center;gap:6px">
                <input type="radio" name="sns-tone" value="catchy" checked> キャッチー
              </label>
              <label style="display:flex;align-items:center;gap:6px">
                <input type="radio" name="sns-tone" value="polite"> 丁寧
              </label>
            </div>
          </div>
        </div>
        <div class="sns-books-selection">
          <label style="display:block;margin-bottom:8px;font-weight:bold">本を選択（搬入済み）</label>
          <div id="sns-books-list" style="border:1px solid var(--border);border-radius:6px;max-height:200px;overflow-y:auto;background:#fff"></div>
          <div style="font-size:12px;color:#666;margin-top:6px;display:flex;gap:12px">
            <button id="sns-books-select-all" type="button" class="link-btn">すべて選択</button>
            <button id="sns-books-clear-all" type="button" class="link-btn">すべて解除</button>
          </div>
        </div>
        <div id="sns-status">生成待ち</div>
        <div id="sns-results"></div>
      </div>
      <div style="padding:0 16px 16px">
        <div class="sns-actions">
          <button id="sns-generate" type="button" class="primary-btn">生成</button>
          <button id="sns-copy" type="button" class="primary-btn">コピー</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
