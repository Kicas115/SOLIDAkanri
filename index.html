<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蔵書管理（MVP）</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>蔵書管理（MVP）</h1>

    <section class="form-section">
      <h2>本を追加</h2>
      <form id="book-form">
        <label>タイトル<br><input id="title" required></label>
        <label>著者<br><input id="author"></label>
        <label>年<br><input id="year" type="number" min="0"></label>
        <button type="submit">追加</button>
      </form>
    </section>

    <section class="list-section">
      <h2>蔵書一覧</h2>
      <ul id="book-list" class="book-list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
